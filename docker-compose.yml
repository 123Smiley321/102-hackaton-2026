services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/marketer}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      AI_AGENT_URL: "${AI_AGENT_URL:-}"
    command: ["python", "-m", "app.bot"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["telegram"]

  publications:
    build: ./publications
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/marketer}"
      BACKEND_URL: "${BACKEND_URL:-http://backend:8000}"
      PUBLISHER_INTERNAL_KEY: "${PUBLISHER_INTERNAL_KEY:-}"
      AI_AGENT_URL: "${AI_AGENT_URL:-}"
      SCHEDULER_INTERVAL_SEC: "${SCHEDULER_INTERVAL_SEC:-15}"
      MONITOR_INTERVAL_SEC: "${MONITOR_INTERVAL_SEC:-60}"
      PUBLICATION_BATCH_SIZE: "${PUBLICATION_BATCH_SIZE:-50}"
      BACKEND_TIMEOUT_SEC: "${BACKEND_TIMEOUT_SEC:-100}"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  ai-agent:
    build: ./ai_agent
    env_file: .env
    environment:
      AI_MEDIA_BASE_URL: "http://ai-agent:8000/media"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ai_media:/data/media
    ports:
      - "8001:8000"   # отладка и форма настройки компании: http://localhost:8001/admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ai_media:
